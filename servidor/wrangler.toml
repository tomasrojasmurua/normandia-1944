# Servidor del cooperativo (Cloudflare Workers). Lo instala GitHub Actions
# (.github/workflows/servidor.yml) con los secretos CLOUDFLARE_API_TOKEN y
# CLOUDFLARE_ACCOUNT_ID del repositorio.
name = "normandy-1944"
main = "src/index.js"
compatibility_date = "2025-06-01"

