name: Publicar juego

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del juego
        uses: actions/checkout@v4

      - name: Recuperar Godot guardado de la vez anterior
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Instalar Godot y el exportador web
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$T"

      - name: Exportar el juego para navegador
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm
          # Arreglos al motor web de Godot (ver tools/web/parchear.py)
          python3 tools/web/parchear.py build/web/index.js
          touch build/web/.nojekyll

      - name: Preparar la publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar:
    needs: exportar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
