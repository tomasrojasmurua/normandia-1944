name: Instalar servidor del cooperativo

# Instala el servidor de Cloudflare cuando cambia la carpeta servidor/ (o a mano
# desde la pestaña Actions). Necesita los secretos CLOUDFLARE_API_TOKEN y
# CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["servidor/**", ".github/workflows/servidor.yml"]
  workflow_dispatch:

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar en Cloudflare
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: servidor
      - name: Probar
        run: |
          URL="${{ steps.wrangler.outputs.deployment-url }}"
          echo "Servidor: $URL"
          sleep 5
          curl -sS "$URL/" || true
